<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>REWARD ISLAND - Evaluación Conductual Interactive</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 850: '#064e3b', 950: '#022c22' },
                        amber: { 450: '#f59e0b', 550: '#d97706' },
                        cyan: { 950: '#083344' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Georgia', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Admin & Final Results -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        html, body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
            height: 100%;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0f172a;
        }
        .island-bg {
            background: radial-gradient(circle at center, #0f4c3a 0%, #062d23 60%, #021a14 100%);
        }
        .gold-glow {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
        }
        .gold-glow-lg {
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.6);
        }
        .emerald-glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #059669;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }
        /* Keyframe animations */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.9; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s infinite ease-in-out;
        }
        .chest-bounce {
            animation: bounce 0.6s cubic-bezier(0.36, 0, 0.66, -0.56) alternate infinite;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased">

    <!-- TOP NAV / BAR -->
    <header class="w-full bg-slate-900/90 border-b border-emerald-800/40 backdrop-blur-md px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-emerald-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-md">
                <i class="fa-solid fa-compass"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide text-amber-400 leading-none">REWARD ISLAND</h1>
                <span class="text-xs text-emerald-400/80 font-medium">Evaluación Conductual Experimental</span>
            </div>
        </div>

        <div id="navControls" class="flex items-center space-x-2">
            <!-- Progress / Score indicator (Shown during game) -->
            <div id="scoreBadge" class="hidden flex items-center bg-slate-800/80 border border-amber-500/30 rounded-full px-3 py-1 text-sm font-semibold text-amber-300">
                <i class="fa-solid fa-coins text-amber-400 mr-2"></i>
                <span id="currentPoints">0</span> <span class="ml-1 text-xs text-amber-500">pts</span>
            </div>

            <!-- Participant ID chip -->
            <div id="participantBadge" class="hidden md:flex items-center bg-slate-800/80 border border-slate-700 rounded-full px-3 py-1 text-xs text-slate-400">
                <i class="fa-solid fa-user-shield text-emerald-400 mr-1.5"></i>
                <span id="displayPartId">ID: Anonymous</span>
            </div>

            <!-- Admin access button -->
            <button onclick="openAdminModal()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition flex items-center gap-1.5">
                <i class="fa-solid fa-lock text-amber-400"></i>
                <span class="hidden sm:inline">Panel Evaluador</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main id="appContainer" class="flex-grow flex items-center justify-center p-3 sm:p-6 max-w-6xl w-full mx-auto">
        <!-- Dynamic views will be rendered here -->
    </main>

    <!-- FOOTER -->
    <footer class="w-full bg-slate-950 border-t border-slate-800/60 py-3 px-4 text-center text-xs text-slate-500">
        <p>REWARD ISLAND &copy; 2026 — Herramienta Experimental de Evaluación de Sensibilidad a la Recompensa (Modelo BAS / Carver & White).</p>
        <p class="mt-1 text-slate-600">No constituye un diagnóstico clínico o evaluación médica validada.</p>
    </footer>

    <!-- MODAL CONTAINER (Global overlays, consent, admin access, resume) -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modalContent" class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <!-- Dynamic Modal Contents -->
        </div>
    </div>

    <!-- MAIN APPLICATION LOGIC SCRIPT -->
    <script>
        /**
         * REWARD ISLAND - Behavioral Assessment Engine
         * Implements Gray's BAS Dimensions: Reward Responsiveness, Drive/Persistence, Fun/Novelty Seeking, Reward Anticipation.
         */

        // ==========================================
        // STATE MANAGEMENT & GLOBAL VARIABLES
        // ==========================================
        const ADMIN_PASSWORD = "admin"; // Evaluator access key
        
        let appState = {
            participantId: null,
            startTime: null,
            endTime: null,
            currentPhase: 0, // 0: Start/Consent, 1: Map Phase 1, 2: Phase 2, 3: Phase 3, 4: Phase 4, 5: Results
            points: 0,
            completedPhases: [false, false, false, false],
            responses: {
                phase1: [], // Anticipation (Mag vs Prob choices)
                phase2: [], // Drive & Effort (Easy vs Hard math/symbol choices)
                phase3: [], // Reward Responsiveness (Speed/Persistence post win/loss)
                phase4: []  // Novelty Seeking (Known vs Unknown choices)
            }
        };

        // Audio Synth Engine (Zero external audio assets required)
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playCoin() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(987.77, now); // B5
                    osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch(e) {}
            },
            playSuccess() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.25);
                    });
                } catch(e) {}
            },
            playClick() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.04);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } catch(e) {}
            }
        };

        // Unlock audio context on touch for iOS Safari
        window.addEventListener('touchstart', function unlockAudio() {
            AudioFX.init();
            window.removeEventListener('touchstart', unlockAudio);
        }, { once: true });
        window.addEventListener('click', function unlockAudioClick() {
            AudioFX.init();
            window.removeEventListener('click', unlockAudioClick);
        }, { once: true });

        // ==========================================
        // STORAGE & DATA PERSISTENCE
        // ==========================================
        const StorageManager = {
            STORAGE_KEY: 'REWARD_ISLAND_USER_SESSION',
            ALL_DATA_KEY: 'REWARD_ISLAND_ALL_SESSIONS_LOG',

            generateID() {
                return 'EXP-' + Math.floor(100000 + Math.random() * 900000);
            },

            saveCurrentState() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(appState));
                    this.saveToGlobalLog(appState);
                } catch(e) {
                    console.error("Save error", e);
                }
            },

            loadCurrentState() {
                try {
                    const raw = localStorage.getItem(this.STORAGE_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch(e) { return null; }
            },

            saveToGlobalLog(state) {
                if(!state.participantId) return;
                try {
                    let logs = JSON.parse(localStorage.getItem(this.ALL_DATA_KEY) || '[]');
                    const existingIdx = logs.findIndex(l => l.participantId === state.participantId);
                    if (existingIdx >= 0) {
                        logs[existingIdx] = state;
                    } else {
                        logs.push(state);
                    }
                    localStorage.setItem(this.ALL_DATA_KEY, JSON.stringify(logs));
                } catch(e) {}
            },

            getAllSessions() {
                try {
                    return JSON.parse(localStorage.getItem(this.ALL_DATA_KEY) || '[]');
                } catch(e) { return []; }
            },

            clearAllData() {
                localStorage.removeItem(this.STORAGE_KEY);
                localStorage.removeItem(this.ALL_DATA_KEY);
            }
        };

        // ==========================================
        // INITIALIZATION & SCREEN ROUTING
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const savedState = StorageManager.loadCurrentState();
            if (savedState && savedState.participantId && savedState.currentPhase > 0 && savedState.currentPhase < 5) {
                showResumeModal(savedState);
            } else {
                initNewSession();
                renderWelcomeScreen();
            }
        });

        function initNewSession() {
            appState = {
                participantId: StorageManager.generateID(),
                startTime: new Date().toISOString(),
                endTime: null,
                currentPhase: 0,
                points: 0,
                completedPhases: [false, false, false, false],
                responses: { phase1: [], phase2: [], phase3: [], phase4: [] }
            };
            updateHeaderUI();
        }

        function updateHeaderUI() {
            const partBadge = document.getElementById('participantBadge');
            const scoreBadge = document.getElementById('scoreBadge');
            const pointsEl = document.getElementById('currentPoints');
            const partIdEl = document.getElementById('displayPartId');

            if (appState.currentPhase > 0) {
                partBadge.classList.remove('hidden');
                scoreBadge.classList.remove('hidden');
                pointsEl.textContent = appState.points;
                partIdEl.textContent = `ID: ${appState.participantId}`;
            } else {
                partBadge.classList.add('hidden');
                scoreBadge.classList.add('hidden');
            }
        }

        function showResumeModal(savedState) {
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <div class="text-center">
                    <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-amber-500/40">
                        <i class="fa-solid fa-rotate-left"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-100 mb-2">Expedición Encontrada</h3>
                    <p class="text-sm text-slate-300 mb-4">Tienes una sesión anterior iniciada (ID: <span class="font-mono text-amber-400 font-bold">${savedState.participantId}</span>). ¿Deseas continuar en la Fase ${savedState.currentPhase} o comenzar una nueva?</p>
                    <div class="flex flex-col sm:flex-row gap-3 justify-center mt-6">
                        <button onclick="resumeSession()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg transition">
                            <i class="fa-solid fa-play mr-2"></i> Continuar Expedición
                        </button>
                        <button onclick="startFreshSession()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl border border-slate-700 transition">
                            Reiniciar Desde Cero
                        </button>
                    </div>
                </div>
            `;
            window.tempSavedState = savedState;
        }

        function resumeSession() {
            appState = window.tempSavedState;
            document.getElementById('modalOverlay').classList.add('hidden');
            updateHeaderUI();
            renderMap();
        }

        function startFreshSession() {
            document.getElementById('modalOverlay').classList.add('hidden');
            initNewSession();
            renderWelcomeScreen();
        }

        // ==========================================
        // VIEW 0: WELCOME & INFORMED CONSENT
        // ==========================================
        function renderWelcomeScreen() {
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-3xl w-full bg-slate-900/80 border border-emerald-700/30 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-md text-center relative overflow-hidden">
                    <!-- Background ambient glow -->
                    <div class="absolute -top-24 -left-24 w-72 h-72 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute -bottom-24 -right-24 w-72 h-72 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

                    <!-- Hero Badge -->
                    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-950/80 border border-emerald-500/30 text-emerald-300 text-xs font-semibold mb-6 animate-pulse-subtle">
                        <i class="fa-solid fa-flask"></i> Protocolo Experimental de Toma de Decisiones
                    </div>

                    <h1 class="text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-emerald-300 to-cyan-300 mb-3 tracking-tight">
                        REWARD ISLAND
                    </h1>
                    <p class="text-lg text-slate-300 italic font-display mb-8">
                        «Cada decisión te acerca a un nuevo tesoro»
                    </p>

                    <!-- Island Graphic SVG -->
                    <div class="my-6 mx-auto max-w-sm rounded-2xl bg-slate-950/60 p-4 border border-slate-800 shadow-inner">
                        <svg class="w-full h-40" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20,160 Q100,140 200,160 T380,160 L400,200 L0,200 Z" fill="#0369a1" opacity="0.4"/>
                            <!-- Main Island Shape -->
                            <path d="M40,150 Q70,70 160,80 T300,90 Q360,130 350,165 Q200,185 40,150 Z" fill="#047857" stroke="#10b981" stroke-width="2"/>
                            <!-- Mountain peak -->
                            <polygon points="180,90 220,30 260,90" fill="#065f46" stroke="#059669" stroke-width="2"/>
                            <polygon points="210,45 220,30 230,45" fill="#f8fafc"/>
                            <!-- Trees -->
                            <circle cx="100" cy="110" r="14" fill="#059669"/>
                            <circle cx="120" cy="120" r="18" fill="#047857"/>
                            <circle cx="300" cy="120" r="16" fill="#059669"/>
                            <!-- Treasure Chest Icon -->
                            <rect x="210" y="140" width="24" height="16" rx="3" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
                            <path d="M210,146 H234" stroke="#78350f" stroke-width="2"/>
                            <!-- Path dotted line -->
                            <path d="M80,140 Q150,120 210,145" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
                        </svg>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-left mb-8">
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800">
                            <div class="text-amber-400 font-bold mb-1 flex items-center gap-2"><i class="fa-regular fa-clock"></i> 15 - 20 Min</div>
                            <div class="text-xs text-slate-400">Duración estimada para completar los 4 territorios.</div>
                        </div>
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800">
                            <div class="text-emerald-400 font-bold mb-1 flex items-center gap-2"><i class="fa-solid fa-gamepad"></i> 4 Territorios</div>
                            <div class="text-xs text-slate-400">Elecciones, desafíos de atención y exploración interactiva.</div>
                        </div>
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800">
                            <div class="text-cyan-400 font-bold mb-1 flex items-center gap-2"><i class="fa-solid fa-user-secret"></i> 100% Anónimo</div>
                            <div class="text-xs text-slate-400">Sin datos identificativos personales. Tu privacidad está protegida.</div>
                        </div>
                    </div>

                    <button onclick="showConsentModal()" class="w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-amber-500 to-emerald-500 hover:from-amber-400 hover:to-emerald-400 text-slate-950 font-black text-lg rounded-2xl shadow-xl transition transform hover:scale-105 gold-glow flex items-center justify-center gap-3 mx-auto">
                        <span>COMENZAR AVENTURA</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            `;
        }

        function showConsentModal() {
            AudioFX.playClick();
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center gap-3 pb-3 border-b border-slate-800">
                        <i class="fa-solid fa-file-contract text-2xl text-emerald-400"></i>
                        <h3 class="text-xl font-bold text-slate-100">Información y Consentimiento</h3>
                    </div>
                    
                    <div class="text-xs text-slate-300 space-y-3 max-h-60 overflow-y-auto p-3 bg-slate-950/60 rounded-xl border border-slate-800 leading-relaxed">
                        <p><strong>Objetivo:</strong> Participarás en una experiencia experimental interactiva diseñada para explorar cómo las personas toman decisiones ante diferentes oportunidades de recompensa y esfuerzo.</p>
                        <p><strong>Registro de Datos:</strong> Durante la actividad se registrarán tus selecciones, la precisión en los ejercicios y tus tiempos de respuesta en milisegundos.</p>
                        <p><strong>Confidencialidad:</strong> Los datos se almacenan vinculados a un código de participante anónimo (<span class="text-amber-400 font-mono">${appState.participantId}</span>). No se recopila nombre, DNI ni correo electrónico.</p>
                        <p><strong>Carácter Educativo / Experimental:</strong> Esta herramienta está inspirada en las dimensiones de sensibilidad a la recompensa (BAS). <em>No constituye un test clínico validado ni emitirá diagnósticos psicológicos ni médicos.</em></p>
                        <p><strong>Voluntariedad:</strong> Puedes abandonar la experiencia en cualquier momento cerrando el navegador.</p>
                    </div>

                    <div class="flex items-start gap-2 pt-2">
                        <input type="checkbox" id="consentCheck" class="mt-1 accent-emerald-500 w-4 h-4 rounded cursor-pointer">
                        <label for="consentCheck" class="text-xs text-slate-300 cursor-pointer">
                            He leído la información, comprendo el carácter anónimo y experimental de la prueba y acepto participar voluntariamente.
                        </label>
                    </div>

                    <div class="flex gap-3 justify-end pt-4 border-t border-slate-800">
                        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-semibold rounded-xl transition">
                            Cancelar / Salir
                        </button>
                        <button onclick="confirmConsent()" class="px-6 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold rounded-xl transition shadow-lg">
                            Aceptar y Comenzar
                        </button>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        function confirmConsent() {
            const check = document.getElementById('consentCheck');
            if (!check || !check.checked) {
                alert("Por favor, marca la casilla de consentimiento para continuar.");
                return;
            }
            closeModal();
            appState.currentPhase = 1;
            StorageManager.saveCurrentState();
            updateHeaderUI();
            renderMap();
        }

        // ==========================================
        // MAP ROUTER & INTERACTIVE ISLAND VIEW
        // ==========================================
        function renderMap() {
            const container = document.getElementById('appContainer');
            
            // Check if all phases completed
            const allDone = appState.completedPhases.every(p => p === true);
            if (allDone) {
                renderFinalResults();
                return;
            }

            container.innerHTML = `
                <div class="max-w-4xl w-full bg-slate-900/90 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                        <div>
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">Mapa de la Isla</span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-100">Selecciona tu Próxima Expedición</h2>
                        </div>
                        <div class="bg-slate-950/80 px-4 py-2 rounded-xl border border-slate-800 text-xs text-slate-300">
                            Progreso: <span class="text-emerald-400 font-bold">${appState.completedPhases.filter(Boolean).length} / 4 Territorios</span>
                        </div>
                    </div>

                    <!-- Map SVG Visual -->
                    <div class="relative w-full aspect-[16/9] bg-slate-950 rounded-2xl border-2 border-emerald-900/60 overflow-hidden shadow-2xl island-bg">
                        <svg class="w-full h-full" viewBox="0 0 800 450">
                            <!-- Ocean grid texture -->
                            <defs>
                                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.1"/>
                                </pattern>
                            </defs>
                            <rect width="800" height="450" fill="url(#grid)" />

                            <!-- Main Island Base Contour -->
                            <path d="M 120 220 Q 180 80 400 90 T 700 200 Q 750 320 580 380 T 220 370 Q 80 320 120 220 Z" fill="#044e3a" stroke="#10b981" stroke-width="3"/>
                            <path d="M 150 210 Q 200 110 380 110 T 670 210 Q 710 300 560 350 T 240 340 Q 120 290 150 210 Z" fill="#065f46"/>

                            <!-- Rivers & Paths -->
                            <path d="M 220,180 Q 320,240 400,220 T 600,280" stroke="#0284c7" stroke-width="6" fill="none" opacity="0.6"/>
                            <path d="M 220,180 Q 320,240 400,220 T 600,280" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>

                            <!-- Dotted connection paths -->
                            <path d="M 220,270 L 340,160 L 520,180 L 600,290" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8,8" fill="none"/>
                        </svg>

                        <!-- INTERACTIVE TERRITORY NODES -->
                        <!-- Territory 1 Node -->
                        <div class="absolute left-[22%] top-[55%] -translate-x-1/2 -translate-y-1/2 text-center">
                            <button onclick="startPhase(1)" ${appState.completedPhases[0] ? '' : ''} 
                                class="w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-xl transition transform hover:scale-110 shadow-lg ${appState.completedPhases[0] ? 'bg-emerald-600 text-slate-100 border-2 border-emerald-400' : 'bg-amber-500 text-slate-950 border-2 border-amber-300 gold-glow animate-bounce'}">
                                ${appState.completedPhases[0] ? '<i class="fa-solid fa-check"></i>' : '1'}
                            </button>
                            <span class="block mt-2 text-xs font-bold bg-slate-900/90 px-2 py-1 rounded border border-slate-700 text-amber-300">
                                El Mapa del Tesoro
                            </span>
                        </div>

                        <!-- Territory 2 Node -->
                        <div class="absolute left-[40%] top-[30%] -translate-x-1/2 -translate-y-1/2 text-center">
                            <button onclick="startPhase(2)" ${!appState.completedPhases[0] ? 'disabled' : ''} 
                                class="w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-xl transition transform ${!appState.completedPhases[0] ? 'bg-slate-800 text-slate-600 border border-slate-700 opacity-60 cursor-not-allowed' : appState.completedPhases[1] ? 'bg-emerald-600 text-slate-100 border-2 border-emerald-400' : 'bg-amber-500 text-slate-950 border-2 border-amber-300 gold-glow animate-bounce'}">
                                ${appState.completedPhases[1] ? '<i class="fa-solid fa-check">' : !appState.completedPhases[0] ? '<i class="fa-solid fa-lock"></i>' : '2'}
                            </button>
                            <span class="block mt-2 text-xs font-bold bg-slate-900/90 px-2 py-1 rounded border border-slate-700 ${!appState.completedPhases[0] ? 'text-slate-500' : 'text-amber-300'}">
                                El Desafío
                            </span>
                        </div>

                        <!-- Territory 3 Node -->
                        <div class="absolute left-[65%] top-[35%] -translate-x-1/2 -translate-y-1/2 text-center">
                            <button onclick="startPhase(3)" ${!appState.completedPhases[1] ? 'disabled' : ''} 
                                class="w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-xl transition transform ${!appState.completedPhases[1] ? 'bg-slate-800 text-slate-600 border border-slate-700 opacity-60 cursor-not-allowed' : appState.completedPhases[2] ? 'bg-emerald-600 text-slate-100 border-2 border-emerald-400' : 'bg-amber-500 text-slate-950 border-2 border-amber-300 gold-glow animate-bounce'}">
                                ${appState.completedPhases[2] ? '<i class="fa-solid fa-check">' : !appState.completedPhases[1] ? '<i class="fa-solid fa-lock"></i>' : '3'}
                            </button>
                            <span class="block mt-2 text-xs font-bold bg-slate-900/90 px-2 py-1 rounded border border-slate-700 ${!appState.completedPhases[1] ? 'text-slate-500' : 'text-amber-300'}">
                                Apertura de Cofres
                            </span>
                        </div>

                        <!-- Territory 4 Node -->
                        <div class="absolute left-[75%] top-[62%] -translate-x-1/2 -translate-y-1/2 text-center">
                            <button onclick="startPhase(4)" ${!appState.completedPhases[2] ? 'disabled' : ''} 
                                class="w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-xl transition transform ${!appState.completedPhases[2] ? 'bg-slate-800 text-slate-600 border border-slate-700 opacity-60 cursor-not-allowed' : appState.completedPhases[3] ? 'bg-emerald-600 text-slate-100 border-2 border-emerald-400' : 'bg-amber-500 text-slate-950 border-2 border-amber-300 gold-glow animate-bounce'}">
                                ${appState.completedPhases[3] ? '<i class="fa-solid fa-check">' : !appState.completedPhases[2] ? '<i class="fa-solid fa-lock"></i>' : '4'}
                            </button>
                            <span class="block mt-2 text-xs font-bold bg-slate-900/90 px-2 py-1 rounded border border-slate-700 ${!appState.completedPhases[2] ? 'text-slate-500' : 'text-amber-300'}">
                                La Última Expedición
                            </span>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-between items-center bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-circle-info text-emerald-400 text-lg"></i>
                            <span class="text-xs text-slate-300">
                                Los territorios se desbloquean ordenadamente. Haz clic en el territorio resaltado para comenzar la fase.
                            </span>
                        </div>
                        <button onclick="renderFinalResults()" class="text-xs text-slate-400 hover:text-slate-200 underline">
                            Ver informe provisional
                        </button>
                    </div>
                </div>
            `;
        }

        function startPhase(phaseNum) {
            AudioFX.playClick();
            appState.currentPhase = phaseNum;
            StorageManager.saveCurrentState();
            
            if (phaseNum === 1) runPhase1();
            else if (phaseNum === 2) runPhase2();
            else if (phaseNum === 3) runPhase3();
            else if (phaseNum === 4) runPhase4();
        }

        // ==========================================
        // FASE 1: EL MAPA DEL TESORO (Anticipación)
        // ==========================================
        // Measure choice between High Mag/Low Prob vs Low Mag/High Prob or equal probs.
        const phase1Trials = [
            { trialId: 1, optionA: { points: 5, prob: 0.8, text: "Camino Seguro (Pequeño)" }, optionB: { points: 15, prob: 0.8, text: "Camino Abundante (Grande)" } },
            { trialId: 2, optionA: { points: 10, prob: 0.9, text: "Sendero Llano" }, optionB: { points: 30, prob: 0.3, text: "Risco Escarpado" } },
            { trialId: 3, optionA: { points: 5, prob: 0.5, text: "Gruta Oscura" }, optionB: { points: 20, prob: 0.5, text: "Cueva del Oro" } },
            { trialId: 4, optionA: { points: 15, prob: 0.85, text: "Playa Tranquila" }, optionB: { points: 40, prob: 0.35, text: "Isla Calavera" } },
            { trialId: 5, optionA: { points: 8, prob: 0.75, text: "Bosque Verde" }, optionB: { points: 25, prob: 0.25, text: "Templo Perdido" } }
        ];
        let p1CurrentIdx = 0;
        let p1StartTime = 0;

        function runPhase1() {
            p1CurrentIdx = 0;
            renderP1Trial();
        }

        function renderP1Trial() {
            if (p1CurrentIdx >= phase1Trials.length) {
                // Finish Phase 1
                appState.completedPhases[0] = true;
                appState.currentPhase = 2;
                StorageManager.saveCurrentState();
                showPhaseCompleteModal("Territorio 1 Completado", "Has finalizado 'El Mapa del Tesoro'. ¡Avanza al segundo territorio!", () => renderMap());
                return;
            }

            const trial = phase1Trials[p1CurrentIdx];
            p1StartTime = performance.now();

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-3xl w-full bg-slate-900 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                        <span class="text-xs font-bold text-amber-400 uppercase tracking-widest"><i class="fa-solid fa-map"></i> Fase 1: El Mapa del Tesoro</span>
                        <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400">Ensayo ${p1CurrentIdx + 1} de ${phase1Trials.length}</span>
                    </div>

                    <h3 class="text-xl font-bold text-slate-100 mb-2">Elige tu camino hacia el cofre</h3>
                    <p class="text-xs text-slate-400 mb-6">Analiza la magnitud de la recompensa y las probabilidades de obtenerla antes de elegir.</p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 my-6">
                        <!-- Option A Card -->
                        <div onclick="selectP1Option('A')" class="group cursor-pointer bg-slate-950/70 border-2 border-slate-800 hover:border-amber-400/80 rounded-2xl p-6 transition transform hover:-translate-y-1 hover:shadow-xl flex flex-col items-center text-center relative overflow-hidden">
                            <div class="w-16 h-16 rounded-2xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition">
                                <i class="fa-solid fa-vault"></i>
                            </div>
                            <h4 class="font-bold text-lg text-slate-200 mb-1">${trial.optionA.text}</h4>
                            <div class="text-2xl font-black text-amber-400 mb-3">+${trial.optionA.points} Puntos</div>
                            <div class="w-full bg-slate-900 rounded-full h-2 mb-2 overflow-hidden border border-slate-800">
                                <div class="bg-emerald-400 h-full" style="width: ${trial.optionA.prob * 100}%"></div>
                            </div>
                            <span class="text-xs text-slate-400 font-semibold">${Math.round(trial.optionA.prob * 100)}% Probabilidad de Éxito</span>
                        </div>

                        <!-- Option B Card -->
                        <div onclick="selectP1Option('B')" class="group cursor-pointer bg-slate-950/70 border-2 border-slate-800 hover:border-amber-400/80 rounded-2xl p-6 transition transform hover:-translate-y-1 hover:shadow-xl flex flex-col items-center text-center relative overflow-hidden">
                            <div class="w-16 h-16 rounded-2xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition">
                                <i class="fa-solid fa-chest-filled"></i>
                                <i class="fa-solid fa-sack-dollar"></i>
                            </div>
                            <h4 class="font-bold text-lg text-slate-200 mb-1">${trial.optionB.text}</h4>
                            <div class="text-2xl font-black text-amber-400 mb-3">+${trial.optionB.points} Puntos</div>
                            <div class="w-full bg-slate-900 rounded-full h-2 mb-2 overflow-hidden border border-slate-800">
                                <div class="bg-emerald-400 h-full" style="width: ${trial.optionB.prob * 100}%"></div>
                            </div>
                            <span class="text-xs text-slate-400 font-semibold">${Math.round(trial.optionB.prob * 100)}% Probabilidad de Éxito</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectP1Option(choiceKey) {
            const rt = Math.round(performance.now() - p1StartTime);
            const trial = phase1Trials[p1CurrentIdx];
            const chosenObj = choiceKey === 'A' ? trial.optionA : trial.optionB;

            // Determine probabilistic outcome
            const success = Math.random() <= chosenObj.prob;
            const pointsEarned = success ? chosenObj.points : 0;
            appState.points += pointsEarned;
            updateHeaderUI();

            // Log response
            appState.responses.phase1.push({
                trialId: trial.trialId,
                chosenOption: choiceKey,
                pointsTarget: chosenObj.points,
                prob: chosenObj.prob,
                rtMs: rt,
                success: success,
                pointsEarned: pointsEarned
            });

            // Show feedback animation
            if (success) AudioFX.playCoin();
            else AudioFX.playClick();

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-md w-full bg-slate-900 border border-slate-700/60 rounded-3xl p-8 text-center shadow-2xl">
                    <div class="w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl mb-4 ${success ? 'bg-amber-500/20 text-amber-400 border-2 border-amber-400 chest-bounce' : 'bg-slate-800 text-slate-500 border border-slate-700'}">
                        <i class="fa-solid ${success ? 'fa-coins' : 'fa-box-open'}"></i>
                    </div>
                    <h3 class="text-2xl font-black ${success ? 'text-amber-400' : 'text-slate-400'} mb-2">
                        ${success ? '¡Cofre Abierto!' : 'Cofre Vacío'}
                    </h3>
                    <p class="text-sm text-slate-300 mb-6">
                        ${success ? `¡Felicidades! Has obtenido <strong class="text-amber-400">+${pointsEarned} puntos</strong>.` : 'El camino no tenía recompensa en esta ocasión.'}
                    </p>
                    <button onclick="nextP1Trial()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition">
                        Continuar Expedición
                    </button>
                </div>
            `;
        }

        function nextP1Trial() {
            p1CurrentIdx++;
            renderP1Trial();
        }

        // ==========================================
        // FASE 2: EL DESAFÍO (Motivación y Esfuerzo)
        // ==========================================
        const phase2Trials = [
            { trialId: 1, easy: { count: 3, points: 5 }, hard: { count: 8, points: 15 } },
            { trialId: 2, easy: { count: 4, points: 6 }, hard: { count: 10, points: 18 } },
            { trialId: 3, easy: { count: 3, points: 5 }, hard: { count: 9, points: 20 } }
        ];
        let p2CurrentTrialIdx = 0;
        let p2ChoiceStartTime = 0;
        let p2CurrentTaskState = null;

        function runPhase2() {
            p2CurrentTrialIdx = 0;
            renderP2Choice();
        }

        function renderP2Choice() {
            if (p2CurrentTrialIdx >= phase2Trials.length) {
                appState.completedPhases[1] = true;
                appState.currentPhase = 3;
                StorageManager.saveCurrentState();
                showPhaseCompleteModal("Territorio 2 Completado", "Has finalizado 'El Desafío'. ¡Continúa hacia la apertura de cofres!", () => renderMap());
                return;
            }

            const trial = phase2Trials[p2CurrentTrialIdx];
            p2ChoiceStartTime = performance.now();

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-3xl w-full bg-slate-900 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                        <span class="text-xs font-bold text-amber-400 uppercase tracking-widest"><i class="fa-solid fa-dumbbell"></i> Fase 2: El Desafío</span>
                        <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400">Desafío ${p2CurrentTrialIdx + 1} de ${phase2Trials.length}</span>
                    </div>

                    <h3 class="text-xl font-bold text-slate-100 mb-2">Elige el esfuerzo para tu siguiente recompensa</h3>
                    <p class="text-xs text-slate-400 mb-6">Puedes optar por una tarea corta o una tarea más exigente con mayor recompensa.</p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 my-6">
                        <!-- Easy Option -->
                        <div onclick="startP2Task('EASY')" class="cursor-pointer bg-slate-950/70 border-2 border-slate-800 hover:border-emerald-400 rounded-2xl p-6 transition transform hover:-translate-y-1 shadow-md flex flex-col justify-between">
                            <div>
                                <span class="inline-block px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-bold mb-3">DESAFÍO A (Bajo Esfuerzo)</span>
                                <h4 class="font-bold text-lg text-slate-200">${trial.easy.count} Operaciones sencillas</h4>
                                <p class="text-xs text-slate-400 mt-1">Cálculos simples de respuesta rápida.</p>
                            </div>
                            <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center">
                                <span class="text-2xl font-black text-amber-400">+${trial.easy.points} Pts</span>
                                <span class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300 font-bold">Comenzar <i class="fa-solid fa-play ml-1"></i></span>
                            </div>
                        </div>

                        <!-- Hard Option -->
                        <div onclick="startP2Task('HARD')" class="cursor-pointer bg-slate-950/70 border-2 border-slate-800 hover:border-amber-400 rounded-2xl p-6 transition transform hover:-translate-y-1 shadow-md flex flex-col justify-between">
                            <div>
                                <span class="inline-block px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 text-xs font-bold mb-3">DESAFÍO B (Alto Esfuerzo)</span>
                                <h4 class="font-bold text-lg text-slate-200">${trial.hard.count} Operaciones sencillas</h4>
                                <p class="text-xs text-slate-400 mt-1">Mayor cantidad de operaciones seguidas.</p>
                            </div>
                            <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center">
                                <span class="text-2xl font-black text-amber-400">+${trial.hard.points} Pts</span>
                                <span class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300 font-bold">Comenzar <i class="fa-solid fa-play ml-1"></i></span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function startP2Task(type) {
            const rtChoice = Math.round(performance.now() - p2ChoiceStartTime);
            const trial = phase2Trials[p2CurrentTrialIdx];
            const config = type === 'EASY' ? trial.easy : trial.hard;

            p2CurrentTaskState = {
                type: type,
                totalRequired: config.count,
                points: config.points,
                completed: 0,
                correct: 0,
                choiceRt: rtChoice,
                startTime: performance.now(),
                currentMath: null
            };

            renderP2TaskScreen();
        }

        function generateMathProblem() {
            const a = Math.floor(Math.random() * 12) + 2;
            const b = Math.floor(Math.random() * 12) + 2;
            return { question: `${a} + ${b} = ?`, answer: a + b };
        }

        function renderP2TaskScreen() {
            if (p2CurrentTaskState.completed >= p2CurrentTaskState.totalRequired) {
                // Task Finished successfully
                const totalTaskTime = Math.round(performance.now() - p2CurrentTaskState.startTime);
                appState.points += p2CurrentTaskState.points;
                updateHeaderUI();
                AudioFX.playSuccess();

                appState.responses.phase2.push({
                    trialId: phase2Trials[p2CurrentTrialIdx].trialId,
                    choiceType: p2CurrentTaskState.type,
                    choiceRtMs: p2CurrentTaskState.choiceRt,
                    completed: p2CurrentTaskState.completed,
                    totalRequired: p2CurrentTaskState.totalRequired,
                    correct: p2CurrentTaskState.correct,
                    taskTimeMs: totalTaskTime,
                    abandoned: false,
                    pointsEarned: p2CurrentTaskState.points
                });

                p2CurrentTrialIdx++;
                renderP2Choice();
                return;
            }

            p2CurrentTaskState.currentMath = generateMathProblem();
            const container = document.getElementById('appContainer');

            container.innerHTML = `
                <div class="max-w-md w-full bg-slate-900 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-amber-400">Progreso del Desafío</span>
                        <span class="text-xs text-slate-400 font-mono">${p2CurrentTaskState.completed} / ${p2CurrentTaskState.totalRequired} Completadas</span>
                    </div>

                    <div class="w-full bg-slate-950 rounded-full h-2 mb-6 overflow-hidden border border-slate-800">
                        <div class="bg-amber-400 h-full transition-all duration-300" style="width: ${(p2CurrentTaskState.completed / p2CurrentTaskState.totalRequired) * 100}%"></div>
                    </div>

                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center mb-6">
                        <span class="text-xs text-slate-500 uppercase font-bold tracking-widest block mb-2">Resuelve la operación</span>
                        <div class="text-4xl font-black text-slate-100">${p2CurrentTaskState.currentMath.question}</div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-6">
                        ${[
                            p2CurrentTaskState.currentMath.answer,
                            p2CurrentTaskState.currentMath.answer + 2,
                            p2CurrentTaskState.currentMath.answer - 1,
                            p2CurrentTaskState.currentMath.answer + 5
                        ].sort(() => Math.random() - 0.5).map(ans => `
                            <button onclick="submitP2Answer(${ans})" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-100 font-bold text-lg rounded-xl border border-slate-700 transition">
                                ${ans}
                            </button>
                        `).join('')}
                    </div>

                    <button onclick="abandonP2Task()" class="w-full py-2 bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs font-semibold rounded-xl border border-rose-800/40 transition">
                        <i class="fa-solid fa-flag mr-1"></i> Abandonar Desafío Actual
                    </button>
                </div>
            `;
        }

        function submitP2Answer(ans) {
            AudioFX.playClick();
            if (ans === p2CurrentTaskState.currentMath.answer) {
                p2CurrentTaskState.correct++;
            }
            p2CurrentTaskState.completed++;
            renderP2TaskScreen();
        }

        function abandonP2Task() {
            const totalTaskTime = Math.round(performance.now() - p2CurrentTaskState.startTime);
            appState.responses.phase2.push({
                trialId: phase2Trials[p2CurrentTrialIdx].trialId,
                choiceType: p2CurrentTaskState.type,
                choiceRtMs: p2CurrentTaskState.choiceRt,
                completed: p2CurrentTaskState.completed,
                totalRequired: p2CurrentTaskState.totalRequired,
                correct: p2CurrentTaskState.correct,
                taskTimeMs: totalTaskTime,
                abandoned: true,
                pointsEarned: 0
            });

            p2CurrentTrialIdx++;
            renderP2Choice();
        }

        // ==========================================
        // FASE 3: LA APERTURA DE LOS COFRES (Respuesta a la recompensa)
        // ==========================================
        // Measures post-reward vs post-non-reward task performance & reaction time.
        const phase3Trials = [
            { trialId: 1, win: true, points: 20 },
            { trialId: 2, win: false, points: 0 },
            { trialId: 3, win: true, points: 20 },
            { trialId: 4, win: false, points: 0 },
            { trialId: 5, win: true, points: 20 }
        ];
        let p3CurrentIdx = 0;
        let p3PostTaskStartTime = 0;

        function runPhase3() {
            p3CurrentIdx = 0;
            renderP3ChestOpen();
        }

        function renderP3ChestOpen() {
            if (p3CurrentIdx >= phase3Trials.length) {
                appState.completedPhases[2] = true;
                appState.currentPhase = 4;
                StorageManager.saveCurrentState();
                showPhaseCompleteModal("Territorio 3 Completado", "Has finalizado 'La Apertura de los Cofres'. ¡Avanza a la última expedición!", () => renderMap());
                return;
            }

            const trial = phase3Trials[p3CurrentIdx];
            if (trial.win) appState.points += trial.points;
            updateHeaderUI();

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-md w-full bg-slate-900 border border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-2xl text-center">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                        <span class="text-xs font-bold text-amber-400">Fase 3: Apertura de Cofres</span>
                        <span class="text-xs text-slate-400">Cofre ${p3CurrentIdx + 1} / ${phase3Trials.length}</span>
                    </div>

                    <div class="w-24 h-24 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-4 ${trial.win ? 'bg-amber-500/20 text-amber-400 border-2 border-amber-400 gold-glow animate-bounce' : 'bg-slate-800 text-slate-500 border border-slate-700'}">
                        <i class="fa-solid ${trial.win ? 'fa-gem' : 'fa-box-open'}"></i>
                    </div>

                    <h3 class="text-2xl font-black ${trial.win ? 'text-amber-400' : 'text-slate-400'} mb-2">
                        ${trial.win ? `¡Has conseguido ${trial.points} puntos!` : 'Sin Recompensa'}
                    </h3>
                    <p class="text-xs text-slate-400 mb-6">
                        ${trial.win ? '¡Gran hallazgo! Continúa para registrar la siguiente actividad.' : 'Este cofre estaba vacío. Continúa con la expedición.'}
                    </p>

                    <button onclick="renderP3PostTask()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg transition">
                        Realizar Actividad Posterior <i class="fa-solid fa-arrow-right ml-1"></i>

        // ==========================================
        // SCORING ALGORITHM (4 Descriptive Indicators 0-100)
        // ==========================================
        function calculateIndicators(state) {
            // 1. Aproximación a la recompensa (Magnitude/Risk drive in Phase 1)
            let p1Score = 50;
            if (state.responses.phase1.length > 0) {
                const highMagChoices = state.responses.phase1.filter(r => r.chosenOption === 'B').length;
                p1Score = Math.round((highMagChoices / state.responses.phase1.length) * 100);
            }

            // 2. Motivación y Persistencia (Hard task selection & completions in Phase 2)
            let p2Score = 50;
            if (state.responses.phase2.length > 0) {
                const hardChoices = state.responses.phase2.filter(r => r.choiceType === 'HARD').length;
                const nonAbandoned = state.responses.phase2.filter(r => !r.abandoned).length;
                const choiceRatio = hardChoices / state.responses.phase2.length;
                const completionRatio = nonAbandoned / state.responses.phase2.length;
                p2Score = Math.round((choiceRatio * 0.6 + completionRatio * 0.4) * 100);
            }

            // 3. Respuesta ante la Recompensa (Speed increase post win vs post non-win in Phase 3)
            let p3Score = 50;
            if (state.responses.phase3.length > 0) {
                const postWinRTs = state.responses.phase3.filter(r => r.priorWin).map(r => r.rtMs);
                const postLossRTs = state.responses.phase3.filter(r => !r.priorWin).map(r => r.rtMs);
                
                const avgWin = postWinRTs.length ? (postWinRTs.reduce((a,b)=>a+b,0)/postWinRTs.length) : 1000;
                const avgLoss = postLossRTs.length ? (postLossRTs.reduce((a,b)=>a+b,0)/postLossRTs.length) : 1000;

                // Faster response post-win relative to loss indicates higher post-reward activation
                const diff = avgLoss - avgWin; // Positive means faster after win
                p3Score = Math.min(100, Math.max(0, Math.round(50 + (diff / 20))));
            }

            // 4. Búsqueda de Nuevas Oportunidades (Novelty choices in Phase 4)
            let p4Score = 50;
            if (state.responses.phase4.length > 0) {
                const unknownChoices = state.responses.phase4.filter(r => r.choice === 'UNKNOWN').length;
                p4Score = Math.round((unknownChoices / state.responses.phase4.length) * 100);
            }

            return {
                anticipation: p1Score,
                persistence: p2Score,
                responsiveness: p3Score,
                novelty: p4Score
            };
        }

            `;
        }

        function inspectSession(partId) {
            const all = StorageManager.getAllSessions();
            const session = all.find(s => s.participantId === partId);
            if (!session) return;

            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');

            content.innerHTML = `
                <div class="space-y-4 max-h-[80vh] overflow-y-auto">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <h3 class="text-lg font-bold text-amber-400 font-mono">Sesión: ${session.participantId}</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <div class="text-xs text-slate-300 space-y-2 font-mono">
                        <p><strong>Inicio:</strong> ${session.startTime}</p>
                        <p><strong>Fin:</strong> ${session.endTime || 'En curso'}</p>
                        <p><strong>Puntos acumulados:</strong> ${session.points}</p>
                    </div>

                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-mono">
                        <span class="text-emerald-400 font-bold block mb-1">Registros de Fase 1 (Anticipación):</span>
                        <pre class="text-slate-400 text-[10px] overflow-x-auto">${JSON.stringify(session.responses.phase1, null, 2)}</pre>
                    </div>

                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-mono">
                        <span class="text-emerald-400 font-bold block mb-1">Registros de Fase 2 (Esfuerzo):</span>
                        <pre class="text-slate-400 text-[10px] overflow-x-auto">${JSON.stringify(session.responses.phase2, null, 2)}</pre>
                    </div>

                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-mono">
                        <span class="text-emerald-400 font-bold block mb-1">Registros de Fase 3 (Respuesta):</span>
                        <pre class="text-slate-400 text-[10px] overflow-x-auto">${JSON.stringify(session.responses.phase3, null, 2)}</pre>
                    </div>

                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-mono">
                        <span class="text-emerald-400 font-bold block mb-1">Registros de Fase 4 (Novedad):</span>
                        <pre class="text-slate-400 text-[10px] overflow-x-auto">${JSON.stringify(session.responses.phase4, null, 2)}</pre>
                    </div>
                </div>
            `;
        }

        function exportAllCSV() {
            const sessions = StorageManager.getAllSessions();
            if(!sessions.length) {
                alert("No hay datos para exportar.");
                return;
            }

            let csv = "ParticipantID,StartTime,EndTime,Points,P1_Anticipation_Score,P2_Persistence_Score,P3_Responsiveness_Score,P4_Novelty_Score\n";
            sessions.forEach(s => {
                const ind = calculateIndicators(s);
                csv += `"${s.participantId}","${s.startTime}","${s.endTime || ''}",${s.points},${ind.anticipation},${ind.persistence},${ind.responsiveness},${ind.novelty}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `REWARD_ISLAND_DATA_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function clearSystemData() {
            if (confirm("¿Estás seguro de que deseas eliminar permanentemente todos los datos guardados en el navegador?")) {
                StorageManager.clearAllData();
                renderAdminDashboard();
            }
        }
    </script>
</body>
</html>
