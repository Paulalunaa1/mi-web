<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroQuiz - Estilo Kahoot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f2f2f2;
            overflow-x: hidden;
        }
        
        .kahoot-bg {
            background-image: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="%23f2f2f2"/><circle cx="10%" cy="20%" r="50" fill="%23e21b3c" opacity="0.1"/><rect x="80%" y="70%" width="80" height="80" fill="%231368ce" opacity="0.1" transform="rotate(45 80 80)"/><polygon points="100,20 120,60 80,60" fill="%23d89e00" opacity="0.1" transform="translate(600, 100)"/><rect x="20%" y="80%" width="60" height="60" fill="%2326890c" opacity="0.1"/></svg>');
            background-size: cover;
        }

        .btn-red { background-color: #e21b3c; box-shadow: 0 4px 0 #b0152e; }
        .btn-blue { background-color: #1368ce; box-shadow: 0 4px 0 #0f52a3; }
        .btn-yellow { background-color: #d89e00; box-shadow: 0 4px 0 #a87b00; }
        .btn-green { background-color: #26890c; box-shadow: 0 4px 0 #1d6b09; }
        
        .btn-red:active, .btn-blue:active, .btn-yellow:active, .btn-green:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 transparent;
        }

        .shape-icon {
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));
        }

        /* Timer Bar Animation */
        #timer-bar {
            transition: width 1s linear, background-color 0.3s;
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.4s ease-out forwards;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="kahoot-bg h-screen flex flex-col items-center justify-center text-gray-800">

    <!-- HEADER / TOP BAR -->
    <header class="fixed top-0 left-0 w-full p-4 flex justify-between items-center bg-white shadow-md z-10">
        <div class="font-bold text-2xl text-purple-700 tracking-tighter">Neuro<span class="text-yellow-500">Quiz</span></div>
        <div id="score-display" class="hidden font-bold text-xl bg-gray-100 px-4 py-1 rounded-full border-2 border-gray-200">
            0 Pts
        </div>
    </header>

    <!-- START SCREEN -->
    <div id="start-screen" class="w-full max-w-2xl px-4 flex flex-col items-center animate-pop text-center mt-12">
        <div class="bg-white p-8 rounded-xl shadow-lg border-2 border-gray-100 w-full">
            <h1 class="text-4xl font-extrabold mb-4 text-gray-800">Cuestionario de Funciones Cerebrales</h1>
            <p class="text-gray-600 mb-8 font-semibold">Basado en apuntes de neuroanatomía (Sistema olfatorio, recompensa, amígdala, hipotálamo y circuito de Papez).</p>
            <button onclick="startGame()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-2xl py-4 px-12 rounded-lg transition-transform transform hover:scale-105 shadow-[0_6px_0_#4c1d95] active:translate-y-[6px] active:shadow-none w-full md:w-auto">
                ¡Empezar!
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden w-full h-full flex flex-col mt-16 px-4 pb-4 max-w-5xl mx-auto">
        
        <!-- Timer -->
        <div class="w-full h-4 bg-gray-300 rounded-full mb-6 overflow-hidden mt-4 shadow-inner">
            <div id="timer-bar" class="h-full bg-purple-500 w-full rounded-full"></div>
        </div>

        <!-- Question Container -->
        <div class="bg-white p-6 md:p-10 rounded-xl shadow-lg border-2 border-gray-100 mb-6 flex-grow flex items-center justify-center animate-pop">
            <h2 id="question-text" class="text-2xl md:text-4xl font-bold text-center leading-tight">
                <!-- Question goes here -->
            </h2>
        </div>

        <!-- Answers Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-auto md:h-64">
            <!-- Option 0 (Red / Triangle) -->
            <button onclick="selectOption(0)" class="btn-red text-white text-left font-bold text-lg md:text-2xl p-4 md:p-6 rounded-lg flex items-center relative overflow-hidden group hover:brightness-110 transition-all">
                <div class="shape-icon mr-4 w-8 h-8 md:w-12 md:h-12 flex-shrink-0 flex items-center justify-center">
                    <svg viewBox="0 0 100 100" fill="white"><polygon points="50,10 90,90 10,90"/></svg>
                </div>
                <span id="option-0-text" class="flex-grow drop-shadow-md z-10 leading-tight"></span>
            </button>
            
            <!-- Option 1 (Blue / Diamond) -->
            <button onclick="selectOption(1)" class="btn-blue text-white text-left font-bold text-lg md:text-2xl p-4 md:p-6 rounded-lg flex items-center relative overflow-hidden group hover:brightness-110 transition-all">
                <div class="shape-icon mr-4 w-8 h-8 md:w-12 md:h-12 flex-shrink-0 flex items-center justify-center">
                    <svg viewBox="0 0 100 100" fill="white"><polygon points="50,10 90,50 50,90 10,50"/></svg>
                </div>
                <span id="option-1-text" class="flex-grow drop-shadow-md z-10 leading-tight"></span>
            </button>
            
            <!-- Option 2 (Yellow / Circle) -->
            <button onclick="selectOption(2)" class="btn-yellow text-white text-left font-bold text-lg md:text-2xl p-4 md:p-6 rounded-lg flex items-center relative overflow-hidden group hover:brightness-110 transition-all">
                <div class="shape-icon mr-4 w-8 h-8 md:w-12 md:h-12 flex-shrink-0 flex items-center justify-center">
                    <svg viewBox="0 0 100 100" fill="white"><circle cx="50" cy="50" r="40"/></svg>
                </div>
                <span id="option-2-text" class="flex-grow drop-shadow-md z-10 leading-tight"></span>
            </button>
            
            <!-- Option 3 (Green / Square) -->
            <button onclick="selectOption(3)" class="btn-green text-white text-left font-bold text-lg md:text-2xl p-4 md:p-6 rounded-lg flex items-center relative overflow-hidden group hover:brightness-110 transition-all">
                <div class="shape-icon mr-4 w-8 h-8 md:w-12 md:h-12 flex-shrink-0 flex items-center justify-center">
                    <svg viewBox="0 0 100 100" fill="white"><rect x="15" y="15" width="70" height="70"/></svg>
                </div>
                <span id="option-3-text" class="flex-grow drop-shadow-md z-10 leading-tight"></span>
            </button>
        </div>
        
        <div class="text-center mt-4 text-gray-500 font-bold">
            Pregunta <span id="current-q-num">1</span> de <span id="total-q-num">x</span>
        </div>
    </div>

    <!-- FEEDBACK SCREEN -->
    <div id="feedback-screen" class="hidden w-full h-full absolute top-0 left-0 z-20 flex flex-col items-center justify-center px-4">
        <div id="feedback-bg" class="absolute inset-0 opacity-90 transition-colors duration-300"></div>
        
        <div class="relative z-30 text-center animate-pop">
            <h1 id="feedback-title" class="text-5xl md:text-7xl font-extrabold text-white drop-shadow-lg mb-4">¡Correcto!</h1>
            <div id="feedback-points" class="bg-black bg-opacity-30 rounded-full px-6 py-2 text-white font-bold text-2xl inline-block mb-8">
                +1000
            </div>
            <p id="correct-answer-text" class="text-white text-xl md:text-2xl font-semibold bg-black bg-opacity-40 p-4 rounded-lg hidden mb-8 shadow-md"></p>
            
            <button onclick="nextQuestion()" class="block mx-auto bg-white text-gray-900 font-bold text-xl py-3 px-10 rounded-lg hover:bg-gray-100 transition-transform transform hover:scale-105 shadow-[0_4px_0_#d1d5db] active:translate-y-[4px] active:shadow-none">
                Siguiente
            </button>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="hidden w-full max-w-2xl px-4 flex flex-col items-center animate-pop text-center mt-12 z-30 relative">
        <div class="bg-white p-8 md:p-12 rounded-xl shadow-2xl border-4 border-purple-500 w-full">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-2 text-purple-700">¡Juego Terminado!</h1>
            <p class="text-gray-500 font-bold text-lg mb-8">Has completado el repaso.</p>
            
            <div class="bg-gray-100 p-6 rounded-lg mb-8 border-2 border-gray-200">
                <p class="text-gray-600 font-semibold mb-2">Puntuación Final</p>
                <p id="final-score" class="text-5xl md:text-6xl font-black text-gray-800">0</p>
            </div>
            
            <button onclick="resetGame()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xl py-4 px-10 rounded-lg transition-transform transform hover:scale-105 shadow-[0_5px_0_#1e3a8a] active:translate-y-[5px] active:shadow-none w-full sm:w-auto">
                Volver a Jugar
            </button>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // Game Data extracted from the provided slides
        const questions = [
            {
                text: "¿Cuál es el único sistema sensorial que alcanza la corteza sin relevo talámico obligatorio?",
                options: [
                    "Sistema auditivo", 
                    "Sistema somatosensorial", 
                    "Sistema olfatorio", 
                    "Sistema visual"
                ],
                correctIndex: 2
            },
            {
                text: "La hiposmia es un signo precoz en enfermedades neurodegenerativas como:",
                options: [
                    "Parkinson y Alzheimer", 
                    "Esquizofrenia", 
                    "Esclerosis Múltiple", 
                    "Síndrome de Klüver-Bucy"
                ],
                correctIndex: 0
            },
            {
                text: "En la vía mesolímbica de recompensa, las neuronas proyectan desde el Área Tegmental Ventral (ATV) hacia:",
                options: [
                    "Corteza prefrontal", 
                    "Núcleo accumbens, amígdala e hipocampo", 
                    "Estriado dorsal", 
                    "Hipófisis"
                ],
                correctIndex: 1
            },
            {
                text: "En el condicionamiento clásico del miedo, ¿dónde adquiere valor aversivo un estímulo neutro?",
                options: [
                    "Hipotálamo posterior", 
                    "Corteza prefrontal ventromedial", 
                    "Hipocampo", 
                    "Núcleo basolateral de la amígdala"
                ],
                correctIndex: 3
            },
            {
                text: "¿Qué área del hipotálamo está asociada principalmente con el control de la saciedad?",
                options: [
                    "Hipotálamo ventromedial", 
                    "Hipotálamo lateral", 
                    "Hipotálamo anterior", 
                    "Núcleo paraventricular"
                ],
                correctIndex: 0
            },
            {
                text: "El circuito cerrado de Papez tiene como función principal consolidar:",
                options: [
                    "La memoria procedimental", 
                    "La respuesta de lucha o huida", 
                    "La memoria episódica", 
                    "La memoria de trabajo"
                ],
                correctIndex: 2
            }
        ];

        // Game State
        let currentQuestionIndex = 0;
        let score = 0;
        let timeRemaining = 0;
        const TIME_PER_QUESTION = 15; // seconds
        let timerInterval;
        let canAnswer = false;

        // DOM Elements
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            feedback: document.getElementById('feedback-screen'),
            end: document.getElementById('end-screen')
        };
        const scoreDisplay = document.getElementById('score-display');
        const timerBar = document.getElementById('timer-bar');
        const questionText = document.getElementById('question-text');
        const qNumDisplay = document.getElementById('current-q-num');
        const qTotalDisplay = document.getElementById('total-q-num');
        
        // Feedback elements
        const feedbackBg = document.getElementById('feedback-bg');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackPoints = document.getElementById('feedback-points');
        const correctAnswerText = document.getElementById('correct-answer-text');
        
        // Init Total
        qTotalDisplay.textContent = questions.length;

        function hideAllScreens() {
            Object.values(screens).forEach(screen => screen.classList.add('hidden'));
        }

        function startGame() {
            currentQuestionIndex = 0;
            score = 0;
            updateScoreDisplay();
            scoreDisplay.classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            hideAllScreens();
            screens.game.classList.remove('hidden');
            screens.game.classList.remove('animate-pop');
            void screens.game.offsetWidth; // trigger reflow
            screens.game.classList.add('animate-pop');

            const currentQ = questions[currentQuestionIndex];
            questionText.textContent = currentQ.text;
            qNumDisplay.textContent = currentQuestionIndex + 1;

            // Load options
            for(let i=0; i<4; i++) {
                document.getElementById(`option-${i}-text`).textContent = currentQ.options[i];
            }

            canAnswer = true;
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeRemaining = TIME_PER_QUESTION;
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = '#a855f7'; // Purple

            timerInterval = setInterval(() => {
                timeRemaining -= 0.1; // update every 100ms for smoother bar
                const percentage = (timeRemaining / TIME_PER_QUESTION) * 100;
                timerBar.style.width = `${percentage}%`;

                // Color change based on time
                if (percentage < 40 && percentage > 20) timerBar.style.backgroundColor = '#eab308'; // Yellow
                if (percentage <= 20) timerBar.style.backgroundColor = '#ef4444'; // Red

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerBar.style.width = '0%';
                    handleTimeOut();
                }
            }, 100);
        }

        function selectOption(index) {
            if (!canAnswer) return;
            canAnswer = false;
            clearInterval(timerInterval);
            
            const currentQ = questions[currentQuestionIndex];
            const isCorrect = (index === currentQ.correctIndex);
            
            showFeedback(isCorrect, currentQ);
        }

        function handleTimeOut() {
            if (!canAnswer) return;
            canAnswer = false;
            const currentQ = questions[currentQuestionIndex];
            showFeedback(false, currentQ, true);
        }

        function showFeedback(isCorrect, questionObj, isTimeOut = false) {
            hideAllScreens();
            screens.feedback.classList.remove('hidden');
            
            // Re-trigger animation
            const content = screens.feedback.querySelector('.relative');
            content.classList.remove('animate-pop');
            void content.offsetWidth;
            content.classList.add('animate-pop');

            correctAnswerText.classList.add('hidden');

            if (isCorrect) {
                // Calculate points based on time left (max 1000)
                const points = Math.round((timeRemaining / TIME_PER_QUESTION) * 500) + 500;
                score += points;
                updateScoreDisplay();
                
                feedbackBg.className = 'absolute inset-0 opacity-95 transition-colors duration-300 bg-green-500';
                feedbackTitle.textContent = '¡Correcto!';
                feedbackPoints.textContent = `+${points}`;
                feedbackPoints.classList.remove('hidden');
            } else {
                feedbackBg.className = 'absolute inset-0 opacity-95 transition-colors duration-300 bg-red-500';
                feedbackTitle.textContent = isTimeOut ? '¡Tiempo Agotado!' : '¡Incorrecto!';
                feedbackPoints.classList.add('hidden');
                
                // Show correct answer
                correctAnswerText.textContent = `Respuesta correcta: ${questionObj.options[questionObj.correctIndex]}`;
                correctAnswerText.classList.remove('hidden');
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            hideAllScreens();
            screens.end.classList.remove('hidden');
            scoreDisplay.classList.add('hidden');
            document.getElementById('final-score').textContent = score;
        }

        function resetGame() {
            hideAllScreens();
            screens.start.classList.remove('hidden');
            score = 0;
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = `${score} Pts`;
            // Add a little pop effect to score
            scoreDisplay.classList.remove('animate-pop');
            void scoreDisplay.offsetWidth;
            scoreDisplay.classList.add('animate-pop');
        }
    </script>
</body>
</html>
